name: PAP Commercial Beta validation (no publication)
on:
  push:
    branches: [feature/admin-beta-commercial-b1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commercial-beta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  beta:
    if: github.repository == 'joaoCarlosGM/pap-saude' && github.ref == 'refs/heads/feature/admin-beta-commercial-b1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - name: Install frozen dependencies
        run: npm ci
      - name: Install Chromium on this disposable CI runner
        run: npx playwright install --with-deps chromium
      - name: Production and isolated migrator dependency audits
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix docker/migrator --omit=dev --audit-level=high
      - name: Generate client and route types
        env: {DATABASE_URL: 'postgresql://build_no_connect:unused@127.0.0.1:1/beta_build_only'}
        run: npx prisma generate && npx next typegen
      - name: Closed policy, preparation, manifest and preserved baseline contracts
        run: |
          npx tsx --test tests/admin-beta-deployment/policy.test.ts tests/admin-beta-deployment/deployment.test.ts
          npx tsx --test tests/email-template-premium.test.ts
          npm run test:beta1:unit
          npx tsc --noEmit
          npm run lint
          git diff --exit-code -- Dockerfile .github/workflows/ci.yml docker-compose.yml package-lock.json prisma/migrations
      - name: Tools package publishing permission and private diagnostics contracts
        run: node --test tests/admin-beta-deployment/publish.test.mjs
      - name: Commercial opt-in, synchronized Nginx and IAM MFA login contracts
        run: |
          npx tsx --test tests/commercial-beta/availability.test.ts
          node tests/beta1/run-isolated.mjs commercial
      - name: Commercial Premium workspace browser and real account flows
        run: node tests/beta1/run-isolated.mjs commercial-browser
      - name: Build candidate images once and reuse builder for tools
        run: bash scripts/admin-beta/build-images.sh "$GITHUB_SHA"
      - name: Isolated Nginx template syntax without host listeners
        run: |
          node scripts/admin-beta/test-nginx.mjs
          node scripts/admin-beta/test-nginx.mjs --commercial
      - name: Production HTTP RSC API, real MFA, IAM, migrations ACL, backup restore and persistent restart
        run: node tests/admin-beta-deployment/run-isolated.mjs "pap-admin-beta-web:$GITHUB_SHA" "pap-admin-beta-migrator:$GITHUB_SHA" "pap-admin-beta-tools:$GITHUB_SHA"
      - name: HIGH CRITICAL scanners for all three images
        run: node scripts/admin-beta/scan-images.mjs "pap-admin-beta-web:$GITHUB_SHA" "pap-admin-beta-migrator:$GITHUB_SHA" "pap-admin-beta-tools:$GITHUB_SHA"
