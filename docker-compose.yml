version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pap_saude_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pap_user
      POSTGRES_PASSWORD: pap_password
      POSTGRES_DB: pap_saude
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pap_user -d pap_saude"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local