name: pap-admin-beta
x-beta-env: &beta-env
  NODE_ENV: production
  PAP_ADMIN_BETA_ONLY: "1"
  PAP_PUBLIC_URL: https://admin-beta.papsaude.com.br
  AUTH_ALLOWED_ORIGINS: https://admin-beta.papsaude.com.br
  AUTH_TRUSTED_CLIENT_IP_HEADER: x-pap-beta-client-ip
  PAP_EMAIL_PROVIDER: ${PAP_EMAIL_PROVIDER:-disabled}
  PAP_EMAIL_EXTERNAL_ENABLED: ${PAP_EMAIL_EXTERNAL_ENABLED:-0}
  PAP_BETA_EMAIL_APPROVED: ${PAP_BETA_EMAIL_APPROVED:-0}
  PAP_EMAIL_FROM: ${PAP_EMAIL_FROM:-}
  PAP_EMAIL_ALLOWED_HOSTS: admin-beta.papsaude.com.br
  PAP_EMAIL_ALLOWED_SENDERS: ${PAP_EMAIL_ALLOWED_SENDERS:-}
  MFA_SECRET_ENCRYPTION_KEY_ID: admin-beta-v1
  MFA_SECRET_ENCRYPTION_KEY_FILE: /run/secrets/mfa_key
  PAP_ADMIN_BETA_PROXY_TOKEN_FILE: /run/secrets/proxy_token
x-entrypoint: &entrypoint
  - ./entrypoint.mjs:/beta/entrypoint.mjs:ro
  - ./migration-manifest.json:/beta/migration-manifest.json:ro
services:
  beta-db:
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: pap_beta_owner
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
    secrets: [owner_password, runtime_password, migrator_password]
    volumes:
      - beta-pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-beta-only.sh:ro
    networks: [beta-private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U pap_beta_owner -d postgres"]
      interval: 5s
      retries: 30
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
  web:
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 128
    image: ${BETA_WEB_IMAGE:?set an immutable Beta SHA tag or digest}
    command: [node, /beta/entrypoint.mjs, web]
    environment:
      <<: *beta-env
      DATABASE_URL_FILE: /run/secrets/runtime_url
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      RESEND_WEBHOOK_SECRET_FILE: /run/secrets/resend_webhook_secret
    secrets: [runtime_url, mfa_key, proxy_token, resend_api_key, resend_webhook_secret]
    volumes: *entrypoint
    ports: ["127.0.0.1:3101:3000"]
    networks: [beta-private, beta-egress]
    depends_on: {beta-db: {condition: service_healthy}}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=67108864,uid=1001,gid=1001
      - /app/.next/cache:rw,nosuid,nodev,size=67108864,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  migrate:
    mem_limit: 512m
    cpus: "1.0"
    profiles: [operations]
    image: ${BETA_MIGRATOR_IMAGE:?set an immutable Beta SHA tag or digest}
    command: [node, /beta/entrypoint.mjs, migrate]
    environment:
      <<: *beta-env
      DATABASE_URL_FILE: /run/secrets/migrator_url
    secrets: [migrator_url, mfa_key, proxy_token]
    volumes: *entrypoint
    networks: [beta-private]
    depends_on: {beta-db: {condition: service_healthy}}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  tools:
    mem_limit: 512m
    cpus: "1.0"
    profiles: [operations]
    image: ${BETA_TOOLS_IMAGE:?set an immutable Beta SHA tag or digest}
    command: [node, /beta/entrypoint.mjs, verify]
    environment:
      <<: *beta-env
      DATABASE_URL_FILE: /run/secrets/migrator_url
    secrets: [migrator_url, mfa_key, proxy_token]
    volumes: *entrypoint
    networks: [beta-private]
    depends_on: {beta-db: {condition: service_healthy}}
    read_only: true
    tmpfs: [/tmp:rw,nosuid,nodev,size=67108864]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  backup:
    mem_limit: 256m
    cpus: "0.5"
    profiles: [operations]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment: {PGHOST: beta-db, PGUSER: pap_beta_migrator, PGDATABASE: pap_admin_beta}
    secrets: [migrator_password]
    networks: [beta-private]
    volumes: [beta-backups:/backups]
    command: [sh, -ec, 'umask 077; export PGPASSWORD="$$(cat /run/secrets/migrator_password)"; f="$$(mktemp /backups/beta-XXXXXXXX.dump)"; pg_dump --format=custom --no-owner --no-privileges --file="$$f"; pg_restore --list "$$f" >/dev/null; printf "Backup criado: %s\n" "$$f"']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  beta-private: {internal: true, labels: {pap.deployment: admin-beta}}
  beta-egress: {labels: {pap.deployment: admin-beta}}
volumes:
  beta-pgdata: {labels: {pap.deployment: admin-beta}}
  beta-backups: {labels: {pap.deployment: admin-beta}}
secrets:
  owner_password: {file: ./secrets/owner_password}
  runtime_password: {file: ./secrets/runtime_password}
  migrator_password: {file: ./secrets/migrator_password}
  runtime_url: {file: ./secrets/runtime_url}
  migrator_url: {file: ./secrets/migrator_url}
  mfa_key: {file: ./secrets/mfa_key}
  proxy_token: {file: ./secrets/proxy_token}
  resend_api_key: {file: ./secrets/resend_api_key}
  resend_webhook_secret: {file: ./secrets/resend_webhook_secret}
