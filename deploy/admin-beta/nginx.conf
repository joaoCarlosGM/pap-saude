# NEW vhost only. Copy manually after DNS/certificate review; never edit existing vhosts.
include /opt/pap-saude-beta/nginx/routes.map.conf;
log_format pap_admin_beta_safe escape=json '{"time":"$time_iso8601","request_id":"$request_id","status":$status,"upstream_status":"$upstream_status","seconds":$request_time}';
server {
    listen 80;
    server_name admin-beta.papsaude.com.br;
    access_log /var/log/nginx/pap-admin-beta-access.log pap_admin_beta_safe;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ { root /opt/pap-saude-beta/acme; }
    location / { return 308 https://admin-beta.papsaude.com.br$uri; }
}
server {
    listen 443 ssl;
    server_name admin-beta.papsaude.com.br;
    ssl_certificate /etc/letsencrypt/live/admin-beta.papsaude.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-beta.papsaude.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/pap-admin-beta-access.log pap_admin_beta_safe;
    # Nginx error logs cannot be given a safe format; use structured access status + app audit.
    error_log /dev/null crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    client_max_body_size 64k;
    location / {
        if ($pap_admin_beta_allowed = 0) { return 404; }
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host admin-beta.papsaude.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host admin-beta.papsaude.com.br;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-PAP-Beta-Client-IP $remote_addr;
        include /opt/pap-saude-beta/nginx/proxy-secret.conf;
        proxy_set_header X-Middleware-Subrequest "";
        proxy_set_header X-Middleware-Rewrite "";
        proxy_set_header X-Middleware-Override-Headers "";
        proxy_set_header X-Invoke-Path "";
        proxy_set_header X-Invoke-Query "";
        proxy_set_header X-Matched-Path "";
        proxy_set_header Next-Action "";
        proxy_hide_header X-Powered-By;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
