/* PAP Admin · Service Desk + Kanban demo additions */
:root { --ta-lime:#c8ed80; --ta-blue:#518ba5; --ta-purple:#897cbd; }
textarea{font:inherit} button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #1d9a88;outline-offset:2px}
.support-cta{position:fixed;bottom:24px;right:24px;z-index:48;background:var(--pap);color:#fff;box-shadow:0 12px 35px rgba(4,79,74,.25);border:1px solid #4b9e8d;border-radius:16px;padding:12px 16px;display:flex;gap:9px;align-items:center;font-weight:800;font-size:12px;transition:transform .15s,background .15s}
.support-cta:hover{background:#087671;transform:translateY(-2px)}
.ta-overview{display:grid;grid-template-columns:1.12fr .88fr;gap:14px;margin-bottom:16px}
.ta-split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.8fr);gap:15px}
.ta-mini{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eff3f0}
.ta-mini:last-child{border-bottom:0}
.ta-mini-title{color:#36524a;font-size:11px;font-weight:760;line-height:1.5}
.ta-mini-meta{color:#9aa8a1;font-size:9px;margin-top:4px}
.pill-priority{display:inline-flex;align-items:center;padding:5px 8px;border-radius:7px;font-size:9px;font-weight:850;white-space:nowrap}
.pill-priority.p1{background:#fff0ee;color:#b64e52}.pill-priority.p2{background:#fff2df;color:#ac742d}.pill-priority.p3{background:#eef5ff;color:#4a7a9e}.pill-priority.p4{background:#f2f4f3;color:#6d827a}
.state-pill{padding:5px 9px;display:inline-flex;border-radius:7px;background:#eef5f3;color:#537c71;font-size:9px;font-weight:850;white-space:nowrap}
.state-pill.new{background:#fceff4;color:#c65785}.state-pill.processing{background:#eff1ff;color:#6371a4}.state-pill.closed{background:#e6f7ed;color:#27866c}
.ta-filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.ta-filters input{flex:1;min-width:160px;max-width:300px;height:36px;border:1px solid var(--border);border-radius:10px;padding:0 11px;background:#fff;color:var(--ink);font-size:11px}
.ta-filters .select{min-width:126px;max-width:190px}
.ta-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:16px}
.ta-summary .card{padding:17px;min-height:104px;display:flex;flex-direction:column;gap:9px}
.ta-summary strong{font-size:28px;letter-spacing:-1px;font-weight:810}.ta-summary small{font-size:10px;color:#8b9b94}
.ta-table{min-width:750px}
.ta-table td{vertical-align:middle;font-size:10px}
.ta-table .issue-identifier{font-weight:850;color:#247f73;font-size:9px;letter-spacing:.5px}
.ta-table .issue-subject{font-weight:750;color:#29493f;margin-top:3px;line-height:1.4;max-width:245px}
.ta-table .issue-small{font-size:9px;color:#97a69d;margin-top:4px}
.ta-status-meter{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:hidden;border-radius:6px;height:12px;gap:3px;margin-top:15px}
.ta-status-meter span{border-radius:5px}
.ta-role-note{padding:12px 16px;border:1px solid #c9e3d8;border-radius:12px;background:#eff8f3;color:#456e62;font-size:10px;line-height:1.6;margin:14px 0}
.ta-role-note strong{color:#1b6e5e}
.kanban-wrap{width:100%;overflow-x:auto;padding-bottom:16px;scrollbar-width:thin}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(218px,1fr));min-width:1140px;gap:12px;align-items:start}
.kanban-col{border-radius:17px;background:#edf2ef;padding:11px;min-height:440px;border:1px solid #e4ebe6;transition:background .15s,border-color .15s}
.kanban-col.drag-over{background:#d5eee1;border:1px dashed #2b947b}
.kanban-col-head{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:6px 5px 14px;font-size:11px;font-weight:830;color:#4a665b}
.kanban-col-head small{background:#fff;border:1px solid #dfe6e2;font-size:10px;padding:3px 7px;border-radius:9px;color:#799188}
.kanban-task{background:#fff;border:1px solid #e3ebe7;box-shadow:0 4px 15px rgba(15,70,50,.04);padding:14px 13px;margin-bottom:10px;border-radius:13px;cursor:grab;transition:box-shadow .15s,transform .15s;position:relative}
.kanban-task:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,70,50,.12)}
.kanban-task:active{cursor:grabbing}.kanban-task.dragging{opacity:.48}

function v3Icon(id){return `<svg class="v3-nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${V3_ICONS[id]||V3_ICONS.overview}</svg>`}
const V3_GROUP_KEY='pap_admin_sidebar_groups_demo';
let navGroupClosed={}; try{navGroupClosed=JSON.parse(localStorage.getItem(V3_GROUP_KEY)||'{}')||{}}catch{}
function renderNav(){
 const n=document.getElementById('nav');const query=(document.getElementById('sidebarFilter')?.value||'').toLocaleLowerCase('pt-BR').trim();
 n.innerHTML=navGroups.map(([group,items],groupI)=>{
  const visible=items.filter(([,label])=>!query||label.toLocaleLowerCase('pt-BR').includes(query)||group.toLocaleLowerCase('pt-BR').includes(query));
  if(!visible.length)return '';
  const isClosed=!query&&Boolean(navGroupClosed[group]);
  return `<section class="v3-nav-section" data-group="${groupI}"><button class="v3-group-heading" type="button" data-toggle-group="${esc(group)}" aria-expanded="${!isClosed}" title="Expandir/recolher ${esc(group)}"><span class="v3-group-text">${esc(group)}</span><span class="v3-group-line"></span><span class="v3-group-arrow ${isClosed?'':'expanded'}">⌄</span></button><div class="v3-group-items ${isClosed?'v3-closed':''}">${visible.map(([id,label])=>{
    let count=id==='requests'?requests.filter(r=>!['Aprovada','Rejeitada'].includes(r.status)).length:id==='tickets'?tickets.filter(t=>!['Resolvido','Encerrado'].includes(t.status)).length:id==='tasks'?tasks.filter(t=>t.status!=='Concluído').length:0;
    return `<button class="nav-btn ${state.page===id?'active':''}" data-nav="${id}" title="${esc(label)}" type="button" aria-current="${state.page===id?'page':'false'}"><span class="v3-active-edge"></span><span class="v3-icon-box">${v3Icon(id)}</span><span class="nav-label">${esc(label)}</span>${count?`<span class="nav-count">${count}</span>`:''}</button>`
   }).join('')}</div></section>`
 }).join('')||'<div class="v3-nav-empty">Nenhum item encontrado</div>';
 n.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.nav)));
 n.querySelectorAll('[data-toggle-group]').forEach(b=>b.addEventListener('click',()=>{let group=b.dataset.toggleGroup;navGroupClosed[group]=!navGroupClosed[group];try{localStorage.setItem(V3_GROUP_KEY,JSON.stringify(navGroupClosed))}catch{}renderNav()}));
}

function header(){let t=titles[state.page];return `<div class="head-row"><div><div class="eyebrow">PAP SAÚDE / ${esc(t[0])}</div><h1 class="page-title">${esc(t[1])}</h1><p class="page-desc">${esc(t[2])}</p></div><div class="controls"><select id="scope" class="select" aria-label="Selecionar município"><option value="all">Toda a rede</option><option value="Belém">Belém</option><option value="Ananindeua">Ananindeua</option><option value="Marituba">Marituba</option></select><select id="period" class="select" aria-label="Período"><option value="7">Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option></select><button class="btn" id="exportBtn">↓ Exportar</button>${state.page==='tickets'?'<button class="btn primary" data-ta-action="create">＋ Novo TA</button>':state.page==='tasks'?'<button class="btn primary" data-ta-action="create-task">＋ Nova tarefa</button>':state.page==='maintenance'?'<button class="btn primary" data-nav="tickets">▤ Ver TAs</button>':'<button class="btn primary" data-modal="newubs">＋ Nova UBS</button>'}</div></div>`}
function metric(label,value,delta,caption,ico,tag='up'){return `<div class="card metric" role="group" aria-label="${label}"><div class="metric-top">${label}<div class="metric-icon">${ico}</div></div><div class="metric-val">${value}</div><div class="metric-foot"><span class="${tag}">${delta}</span>${caption}</div></div>`}
function timescale(){return state.days===7?['Seg','Ter','Qua','Qui','Sex','Sáb','Dom']:state.days===90?['Ago','Set','Out']:['01 out','07 out','13 out','19 out','25 out','30 out']}
function lineChart(){let period=state.days===7?[[15,21,26,25,35,34,39],[8,10,12,17,17,21,23]]:state.days===90?[[13,18,20,33,44,57,72],[7,13,15,21,23,31,41]]:[[17,24,20,39,44,39,59,54,70,64,78,81],[8,12,15,17,23,27,31,39,38,43,48,51]];let W=660,H=190,margin=18;const path=(arr)=>arr.map((v,i)=>`${i?'L':'M'}${margin+i*(W-2*margin)/(arr.length-1)},${H-15-v*1.75}`).join(' ');let primary=path(period[0]),secondary=path(period[1]);return `<svg class="line-chart" viewBox="0 0 660 190" role="img" aria-label="Gráfico ilustrativo de evolução de utilização das UBS e dos profissionais"><defs><linearGradient id="grline" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#64b99a" stop-opacity=".27"/><stop offset="1" stop-color="#b1e9d7" stop-opacity="0"/></linearGradient></defs>${[35,80,125,170].map(y=>`<line x1="13" y1="${y}" x2="648" y2="${y}" stroke="#ecf1ee" stroke-width="1"/>`).join('')}<path d="${primary} L642,175 L18,175 Z" fill="url(#grline)"/><path d="${secondary}" fill="none" stroke="#e2a3b9" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="${primary}" fill="none" stroke="#0b7d73" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${margin+(period[0].length-1)*(W-2*margin)/(period[0].length-1)}" cy="${H-15-period[0].at(-1)*1.75}" r="5" fill="#0b7d73" stroke="white" stroke-width="3"/></svg><div class="chart-labels">${timescale().map(v=>`<span>${v}</span>`).join('')}</div>`}
function chartCard(){return `<div class="card card-pad"><div class="card-title-row"><div><h3 class="card-title">Evolução da utilização</h3><p class="card-sub">Atividade validada · comparação de grupos</p></div><span class="chip">${state.days} dias</span></div>${lineChart()}<div class="trend-legend"><span><i class="legend-dot"></i> UBS em uso</span><span><i class="legend-dot pink"></i> Profissionais ativos</span></div></div>`}
function donutCard(){return `<div class="card card-pad"><div class="card-title-row"><div><h3 class="card-title">Adoção da rede</h3><p class="card-sub">UBS elegíveis com utilização efetiva</p></div><span class="chip">Indicador-chave</span></div><div class="donut-wrap"><svg viewBox="0 0 150 150" class="donut" role="img" aria-label="Exemplo ilustrativo: 67% de adoção"><circle cx="75" cy="75" r="55" fill="none" stroke="#eaf2ed" stroke-width="16"/><circle cx="75" cy="75" r="55" fill="none" stroke="#0e8c79" stroke-width="16" stroke-dasharray="67 33" pathLength="100" stroke-linecap="round" transform="rotate(-90 75 75)"/><text class="donut-center" x="75" y="78" text-anchor="middle">67%</text><text class="donut-small" x="75" y="96" text-anchor="middle">em uso</text></svg><div class="donut-list"><div><span><i class="small-dot" style="background:#0e8c79"></i> Em uso</span><strong>12 UBS</strong></div><div><span><i class="small-dot" style="background:#dceee4"></i> Sem atividade</span><strong>6 UBS</strong></div><div><span><i class="small-dot" style="background:#e4a9c0"></i> Em onboarding</span><strong>4 UBS</strong></div></div></div><div class="inline-notice" style="margin:4px 0 0">Uso real ≠ cadastro. Este KPI considera eventos funcionais válidos, não apenas login.</div></div>`}
function requestsTable(short=false){let list=filtered(requests);if(short)list=list.filter(r=>r.status!=='Aprovada'&&r.status!=='Rejeitada').slice(0,3);return `<div class="card table-card"><div class="table-head"><div><h3 class="card-title">${short?'Solicitações aguardando análise':'Fila de solicitações institucionais'}</h3><p class="card-sub">${short?'Demandas que precisam de uma decisão':'Aprovação controlada de cadastro e adesão'}</p></div><button class="link-button" data-nav="requests">${short?'Ver todas →':'Atualizar visualização ↗'}</button></div><div class="table-scroll"><table><thead><tr><th>Unidade</th><th>Município</th><th>Data</th><th>Situação</th><th></th></tr></thead><tbody>${list.length?list.map(r=>`<tr><td><div class="td-name"><span class="monogram">${esc(r.name.split(' ').slice(-1)[0][0])}</span>${esc(r.name)}</div></td><td>${esc(r.city)}</td><td>${esc(r.date)}</td><td>${statusLabel(r.status)}</td><td><button class="link-button" data-request="${r.id}">${r.status==='Aprovada'?'Detalhes':'Analisar →'}</button></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">Nenhuma solicitação encontrada neste filtro.</div></td></tr>`}</tbody></table></div></div>`}
function usageCard(){let bars=[['Atendimentos',82],['Pesquisa paciente',71],['Painel clínico',64],['Protocolo MEOWS',43]];return `<div class="card card-pad"><div class="card-title-row"><div><h3 class="card-title">Funcionalidades utilizadas</h3><p class="card-sub">Distribuição ilustrativa de eventos</p></div><button data-nav="metrics" class="link-button">Detalhar →</button></div>${bars.map(([label,v])=>`<div class="barrow"><span>${label}</span><div class="bar-track"><div class="bar-fill" style="width:${v}%"></div></div><strong>${v}%</strong></div>`).join('')}<p class="meta-note">Participação relativa dos eventos de demonstração. Não representa eficiência clínica.</p></div>`}
function activityCard(){return `<div class="card card-pad"><div class="card-title-row"><div><h3 class="card-title">Atividade administrativa</h3><p class="card-sub">Ações recentes da rede</p></div><button data-nav="audit" class="link-button">Auditoria →</button></div><div class="timeline"><div class="event"><div class="event-icon">▥</div><div class="event-text"><strong>Nova solicitação de UBS recebida</strong><small>UBS São José · há 1 h</small></div></div><div class="event"><div class="event-icon pink">✉</div><div class="event-text"><strong>Convite de responsável aguardando aceite</strong><small>UBS Bela Vista · há 3 h</small></div></div><div class="event"><div class="event-icon">✓</div><div class="event-text"><strong>Profissional ativou seu acesso</strong><small>UBS Central · ontem</small></div></div></div></div>`}

function kanbanCard(t){let checklist=t.checklist?t.checklist.split('\n').filter(Boolean):[],done=(t.done||[]).filter(Boolean).length;return `<article class="kanban-task" draggable="true" tabindex="0" role="button" aria-label="Abrir tarefa ${esc(t.id)}: ${esc(t.title)}" data-open-task="${t.id}" data-drag-task="${t.id}"><div class="kt-top"><span class="kt-id">${t.id}</span>${priorityBadge(t.priority)}</div><div class="kt-title">${esc(t.title)}</div>${t.ticketId?`<span class="kt-linked">↗ ${esc(t.ticketId)}</span>`:''}<div class="kt-foot"><span class="kt-role"><i class="kt-role-dot"></i>${esc(ROLE_LABELS[t.role]||t.role)}</span><span class="kt-due">${esc(t.due||'Sem prazo')}</span></div>${checklist.length?`<div class="mini-progress"><span style="width:${pct(done,checklist.length)}%"></span></div><div class="issue-small" style="margin-top:7px">${done}/${checklist.length} verificações</div>`:''}</article>`}

or e deixará trilha de auditoria.</p></section>`}

vice Desk</span></div><div class="ta-mini"><div><div class="ta-mini-title">TAs encerrados/resolvidos</div><div class="ta-mini-meta">Total do histórico</div></div><strong>${s.closed}</strong></div><div class="ta-mini"><div><div class="ta-mini-title">Pendências fora do SLA</div><div class="ta-mini-meta">TAs em aberto ultrapassando o prazo</div></div><strong>${s.late}</strong></div><div class="ta-mini"><div><div class="ta-mini-title">Tarefas em andamento</div><div class="ta-mini-meta">Kanban de desenvolvimento e gestão</div></div><strong>${tasks.filter(t=>t.status==='Em andamento').length}</strong></div><div class="ta-mini"><div><div class="ta-mini-title">Tarefas concluídas</div><div class="ta-mini-meta">Demandas finalizadas no quadro</div></div><strong>${tasks.filter(t=>t.status==='Concluído').length}</strong></div><div class="ta-issue-progress"><strong>Como calculamos o SLA?</strong> Prioridades demonstrativas: P1 até 4h, P2 até 24h, P3 até 72h e P4 até 120h. O cumprimento considera somente tickets resolvidos e compara o tempo total com o limite da prioridade. Esses parâmetros deverão ser configuráveis no sistema definitivo.</div></div></div><div class="inline-notice" style="margin-top:16px">Dados e SLAs são fictícios, apenas para revisar o conceito. Métricas de manutenção não representam qualidade clínica. O produto real deverá coletar esses dados com permissões, trilhas de auditoria e fonte verificável.</div></section>`}
function bindTaControls(p){p.querySelectorAll('[data-open-ticket]').forEach(e=>e.addEventListener('click',()=>openTicket(e.dataset.openTicket)));p.querySelectorAll('[data-open-task]').forEach(e=>{e.addEventListener('click',()=>openTask(e.dataset.openTask));e.addEventListener('keydown',v=>{if(v.key==='Enter'||v.key===' '){v.preventDefault();openTask(e.dataset.openTask)}})});

let board=p.querySelector('.kanban');if(board){p.querySelectorAll('[data-drag-task]').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.dragTask);e.dataTransfer.effectAllowed='move';el.classList.add('dragging')});el.addEventListener('dragend',()=>el.classList.remove('dragging'))});p.querySelectorAll('[data-drop-status]').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));el.addEventListener('drop',e=>{e.preventDefault();let id=e.dataTransfer.getData('text/plain'),t=tasks.find(x=>x.id===id);el.classList.remove('drag-over');if(!t)return;t.status=el.dataset.dropStatus;saveTa();render();toast('Tarefa '+id+' movida para '+t.status+' (simulação)')})})}}

function openNewTicket(publicMode=false){popup(`<h3>${publicMode?'Enviar feedback ou relatar problema':'Novo Ticket de Anormalidade'}</h3><p>Crie um relato de demonstração para a equipe PAP. Não informe dados de pacientes nem credenciais. Nenhuma mensagem será enviada.</p><form id="createTA"><div class="ta-modal-grid"><div class="field"><label for="taTypeNew">Tipo</label><select id="taTypeNew" name="type" required>${['Incidente','Feedback','Melhoria','Dúvida'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="taModuleNew">Módulo</label><select id="taModuleNew" name="module">${['Atendimentos','Convites','Acessos','Organizações','Dashboard','Protocolos','Relatórios','Outros'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label for="taTitleNew">Título do relato</label><input id="taTitleNew" name="title" required minlength="6" maxlength="110" placeholder="Descreva o problema em poucas palavras"></div><div class="field"><label for="taDescNew">Descrição do ocorrido</label><textarea id="taDescNew" name="description" required minlength="12" maxlength="2000" placeholder="O que aconteceu? Qual era o resultado esperado? Como reproduzir?"></textarea></div><div class="ta-modal-grid"><div class="field"><label for="taUnitNew">Unidade / organização</label><select id="taUnitNew" name="unit">${['UBS São José','UBS Central','UBS Vila Nova','Município de Belém','PAP Saúde'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="taSeverityNew">Urgência percebida</label><select id="taSeverityNew" name="priority"><option value="P3">Normal · P3</option><option value="P2">Alta · P2</option><option value="P4">Baixa · P4</option>${publicMode?'':'<option value="P1">Crítica · P1</option>'}</select></div></div><p class="ta-hint">A prioridade definitiva será confirmada na triagem. No produto real, anexos e informações técnicas devem ser protegidos e revisados antes do compartilhamento.</p><div document.getElementById('createTA').addEventListener('submit',e=>{e.preventDefault();let d=new FormData(e.target);let t={id:freshTicketId(),title:String(d.get('title')).trim(),description:String(d.get('description')).trim(),type:String(d.get('type')),module:String(d.get('module')),unit:String(d.get('unit')),reporter:publicMode?'Usuário de teste':'Admin PAP (demo)',source:publicMode?'Feedback no aplicativo':'Central administrativa',priority:String(d.get('priority')),status:'Aberto',assignee:'Não atribuído',createdAt:new Date().toISOString(),comments:[]};tickets.unshift(t);saveTa();closeModal();if(!publicMode)state.page='tickets';render();toast(t.id+' registrado localmente; pronto para triagem simulada.')})}
function openTicket(id){const t=tickets.find(x=>x.id===id);if(!t)return;const linked=tasks.filter(x=>x.ticketId===t.id);const editable=['PAP_ADMIN','SENIOR_DEV','IT_SUPPORT'].includes(state.role);
popup(`<div class="eyebrow">TICKET DE ANORMALIDADE · ${esc(t.id)}</div><h3>${esc(t.title)}</h3><div class="ta-modal-subline">${priorityBadge(t.priority)} ${taStatusTag(t.status)} <span class="chip">${esc(t.type)}</span><span class="chip">${esc(t.module)}</span></div><div class="ta-description">${esc(t.description)}</div><div class="ta-task-detail"><span>▥ ${esc(t.unit)}</span><span>·</span><span>◷ Registrado ${esc(dateLabel(t.createdAt))}</span><span>·</span><span>${esc(t.source)}</span></div><div class="ta-issue-progress"><strong>Atendimento e SLA</strong>Responsável: ${esc(t.assignee)} · Prazo previsto: ${SEVERITY[t.priority]}h · ${isLate(t)?'Prazo excedido':'Dentro do prazo'}.</div><form id="updateTicket"><div class="ta-modal-grid"><div class="field"><label for="taStatusEdit">Etapa do ticket</label><select name="status" id="taStatusEdit" ${editable?'':'disabled'}>${TA_FLOW.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="taOwnerEdit">Fila / atribuição</label><select name="assignee" id="taOwnerEdit" ${editable?'':'disabled'}>${['Não atribuído','Suporte TI','Desenvolvedor sênior','Produto PAP','Admin PAP'].map(s=>`<option ${s===t.assignee?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="ta-section-subtitle">Tarefas vinculadas</div>${linked.length?linked.map(x=>`<div class="ta-mini"><div><div class="ta-mini-title">${esc(x.title)}</div><div class="ta-mini-meta">${esc(x.id)} · ${esc(x.status)}</div></div><button type="button" class="link-button" data-linked-task="${x.id}">Abrir →</button></div>`).join(''):'<p class="ta-hint">Ainda não existe tarefa vinculada a este TA.</p>'}<div class="ta-section-subtitle">Histórico de mensagens</div><div class="ta-comments">${t.comments.length?t.comments.map(c=>`<div class="ta-comment"><strong>${esc(c.author)}</strong><small>${dateLabel(c.date)}</small><div style="margin-top:5px">${esc(c.text)}</div></div>`).join(''):'<div class="ta-hint">Sem comentários ainda.</div>'}</div><div class="field"><label for="taComment">Adicionar comentário</label><textarea id="taComment" name="comment" maxlength="1000" placeholder="Próximos passos, diagnóstico ou resposta à equipe..."></textarea></div><div class="modal-actions" style="flex-wrap:wrap;justify-content:space-between"><button type="button" class="btn soft" id="makeLinkedTask" ${editable?'':'disabled'}>＋ Gerar tarefa</button><div class="ta-inline-actions"><button type="button" class="btn" data-dismiss>Fechar</button><button type="submit" class="btn primary" ${editable?'':'disabled'}>Salvar alterações</button></div></div></form>${editable?'':'<p class="ta-hint">Este perfil apenas consulta tickets nesta simulação. Alterações exigem a área de TI ou administração PAP.</p>'}`);

document.getElementById('updateTicket').addEventListener('submit',e=>{e.preventDefault();if(!editable)return;const d=new FormData(e.target),nextStatus=String(d.get('status')),comment=String(d.get('comment')).trim(),now=new Date().toISOString();if(t.status!==nextStatus){t.status=nextStatus;if((nextStatus==='Resolvido'||nextStatus==='Encerrado')&&!t.resolvedAt)t.resolvedAt=now;if(!['Resolvido','Encerrado'].includes(nextStatus))delete t.resolvedAt;if(nextStatus!=='Aberto'&&!t.firstResponseAt)t.firstResponseAt=now;}t.assignee=String(d.get('assignee'));if(comment){t.comments.push({author:ROLE_LABELS[state.role],date:now,text:comment});if(!t.firstResponseAt)t.firstResponseAt=now;}saveTa();closeModal();render();toast(id+' atualizado e armazenado na prévia.')});}
function openNewTask(ticketId=''){let taskTicket=tickets.find(x=>x.id===ticketId);popup(`<h3>Nova tarefa de trabalho</h3><p>Defina o responsável, a prioridade e a etapa do quadro. A tarefa pode ser vinculada a um TA para rastrear correções.</p><form id="createTask"><div class="field"><label>Título da tarefa</label><input name="title" required minlength="6" maxlength="120" placeholder="Ex.: Investigar falha de ativação" value="${taskTicket?esc('Analisar '+taskTicket.title):''}"></div><div class="field"><label>Descrição</label><textarea name="description" placeholder="Critérios de aceite e resultados esperados..." maxlength="1500">${taskTicket?esc(taskTicket.description):''}</textarea></div><div class="ta-modal-grid"><div class="field"><label>Papel responsável</label><select name="role">${Object.entries(ROLE_LABELS).map(([key,v])=>`<option value="${key}" ${key===(taskTicket?'SENIOR_DEV':state.role)?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Prioridade</label><select name="priority">${['P1','P2','P3','P4'].map(x=>`<option ${x===(taskTicket?taskTicket.priority:'P3')?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="ta-modal-grid"><div class="field"><label>Quadro</label><select name="board">${['PAP · Engenharia e TI','PAP · Operação da rede','UBS · Administração'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Previsão de conclusão</label><input type="date" name="due" value="${future(72)}"></div></div><div class="ta-modal-grid"><div class="field"><label>Etapa inicial</label><select name="status">${TASK_FLOW.map(x=>`<option ${x==='A fazer'?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Vincular TA</label><select name="ticketId"><option value="">Sem TA vinculado</option>${tickets.map(x=>`<option value="${esc(x.id)}" ${x.id===ticketId?'selected':''}>${esc(x.id+' · '+x.title.slice(0,37))}</option>`).join('')}</select></div></div><div class="field"><label>Checklist (uma tarefa por linha)</label><textarea name="checklist" placeholder="Reproduzir falha\nCorrigir código\nExecutar testes"></textarea></div><div class="modal-actions"><button type="button" class="btn" data-dismiss>Cancelar</button><button class="btn primary" type="submit">Criar tarefa</button></div></form>`);
document.getElementById('createTask').addEventListener('submit',e=>{e.preventDefault();let d=new FormData(e.target),checklist=String(d.get('checklist')).split('\n').map(x=>x.trim()).filter(Boolean).slice(0,12).join('\n');const role=String(d.get('role'));let item={id:freshTaskId(),title:String(d.get('title')).trim(),description:String(d.get('description')),role,assignee:ROLE_LABELS[role],priority:String(d.get('priority')),status:String(d.get('status')),board:String(d.get('board')),due:String(d.get('due')),ticketId:String(d.get('ticketId')),checklist,done:checklist?checklist.split('\n').map(()=>false):[]};tasks.unshift(item);saveTa();closeModal();state.page='tasks';state.taskRole='all';state.board='all';render();toast(item.id+' adicionada ao quadro demonstrativo.')});}
function openTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;let checks=t.checklist?t.checklist.split('\n').filter(Boolean):[];
popup(`<div class="eyebrow">ATIVIDADE · ${t.id}</div><h3>${esc(t.title)}</h3><div class="ta-modal-subline">${priorityBadge(t.priority)} ${taStatusTag(t.status)} <span class="chip">${esc(t.board)}</span></div><div class="ta-description">${esc(t.description||'Nenhuma descrição adicional.')}</div>${t.ticketId?`<div class="ta-issue-progress"><strong>Ticket relacionado</strong><button type="button" class="link-button" id="showLinkedTA">${esc(t.ticketId)} → Abrir anormalidade</button></div>`:''}<form id="editTask"><div class="ta-modal-grid"><div class="field"><label>Etapa do Kanban</label><select name="status">${TASK_FLOW.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Papel responsável</label><select name="role">${Object.entries(ROLE_LABELS).map(([key,v])=>`<option value="${key}" ${t.role===key?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label>Prioridade</label><select name="priority">${['P1','P2','P3','P4'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Data-alvo</label><input name="due" type="date" value="${esc(t.due||'')}"></div></div><div class="ta-section-subtitle">Checklist de execução</div>${checks.length?checks.map((line,i)=>`<label class="ta-mini" style="justify-content:flex-start;cursor:pointer"><input type="checkbox" name="check${i}" ${t.done&&t.done[i]?'checked':''}> <span class="ta-mini-title" style="font-weight:600">${esc(line)}</span></label>`).join(''):'<div class="ta-hint">Nenhuma checklist cadastrada para esta tarefa.</div>'}<div class="modal-actions"><button type="button" class="btn" data-dismiss>Cancelar</button><button class="btn primary" type="submit">Salvar tarefa</button></div></form>`);
let linked=document.getElementById('showLinkedTA');if(linked)linked.addEventListener('click',()=>openTicket(t.ticketId));document.getElementById('editTask').addEventListener('submit',e=>{e.preventDefault();let d=new FormData(e.target);Object.assign(t,{status:String(d.get('status')),role:String(d.get('role')),assignee:ROLE_LABELS[String(d.get('role'))],priority:String(d.get('priority')),due:String(d.get('due')),done:checks.map((_,i)=>d.get('check'+i)==='on')});saveTa();closeModal();render();toast(t.id+' atualizada na demonstração.')});}
function exportTickets(){let fields=['ID','Título','Tipo','Módulo','Unidade','Prioridade','Estado','Responsável','Criado em','Resolvido em'];let rows=tickets.map(t=>[t.id,t.title,t.type,t.module,t.unit,t.priority,t.status,t.assignee,t.createdAt,t.resolvedAt||'']);let csv=[fields,...rows].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='PAP-TA-DEMONSTRATIVO.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Relatório demonstrativo de TAs exportado.')}
function initTaExtras(){const top=document.querySelector('.top-right');if(top&&!document.getElementById('previewRole')){let role=document.createElement('select');role.id='previewRole';role.className='ta-role-select';role.setAttribute('aria-label','Perfil demonstrativo');role.title='Simular visão por perfil (não altera permissões reais)';role.innerHTML=Object.entries(ROLE_LABELS).map(([key,v])=>`<option value="${key}">${esc(v)}</option>`).join('');top.insertBefore(role,top.querySelector('.mini-avatar'));role.addEventListener('change',e=>{state.role=e.target.value;state.taskRole=state.page==='tasks'?state.role:'all';render();toast('Perfil demonstrativo: '+ROLE_LABELS[state.role]+'. Permissões reais não são alteradas.')})}
let report=document.createElement('button');report.className='support-cta';report.id='floatingTA';report.type='button';report.setAttribute('aria-label','Relatar problema ou feedback');report.innerHTML='<span style="font-size:17px">✉</span> Enviar feedback / TA';report.addEventListener('click',()=>openNewTicket(true));document.body.appendChild(report);
}
initTaExtras();

function render(){document.getElementById('crumb').textContent=titles[state.page][0];renderNav();let p=document.getElementById('main');p.innerHTML=header()+({overview:enhancedOverview,requests:requestsPage,organizations:organizationsPage,people:peoplePage,invites:invitationsPage,metrics:metricsPage,access:accessPage,tickets:ticketsPage,tasks:taskBoard,maintenance:maintenancePage}[state.page]||simplePage)();document.getElementById('scope').value=state.scope;document.getElementById('period').value=state.days;document.getElementById('scope').addEventListener('change',e=>{state.scope=e.target.value;render()});document.getElementById('period').addEventListener('change',e=>{state.days=Number(e.target.value);render();skeletonize()});document.getElementById('exportBtn').addEventListener('click',download);p.querySelectorAll('[data-nav]').forEach(x=>x.addEventListener('click',()=>navigate(x.dataset.nav)));p.querySelectorAll('[data-modal]').forEach(x=>x.addEventListener('click',()=>modal(x.dataset.modal)));p.querySelectorAll('[data-request]').forEach(x=>x.addEventListener('click',()=>modal('review',Number(x.dataset.request))));p.querySelectorAll('[data-resend]').forEach(x=>x.addEventListener('click',()=>{invites[Number(x.dataset.resend)].status='Pendente';toast('Reenvio simulado. Nenhum e-mail foi enviado.');render()}));p.querySelectorAll('[data-showunit]').forEach(x=>x.addEventListener('click',()=>toast('Ficha de '+x.dataset.showunit+' — visualização conceitual')));p.querySelectorAll('[data-showuser]').forEach(x=>x.addEventListener('click',()=>toast('Perfil de '+x.dataset.showuser+' — visualização conceitual')));if(p.querySelector('#tableSearch'))p.querySelector('#tableSearch').addEventListener('input',e=>{state.query=e.target.value;render();let input=document.getElementById('tableSearch');input.focus();input.setSelectionRange(input.value.length,input.value.length)});if(p.querySelector('#downloadCSV'))p.querySelector('#downloadCSV').addEventListener('click',download);if(p.querySelector('#replaySkeleton'))p.querySelector('#replaySkeleton').addEventListener('click',()=>{navigate('overview');});bindTaControls(p);skeletonize()}
function skeletonize(){const selectors=document.querySelectorAll('[data-load]');selectors.forEach((el,i)=>{el.classList.add('skeleton');setTimeout(()=>{el.classList.remove('skeleton');el.classList.add('page-appear')},180+i*350)})}
function navigate(v){state.page=v;state.query='';render();document.getElementById('side').classList.remove('mobile-open');document.getElementById('overlay').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});}
function closeModal(){document.getElementById('modalMount').innerHTML=''}
function modal(kind,id){const r=requests.find(o=>o.id===id);let title='',desc='',form='';if(kind==='review'){title=r?.name||'Solicitação';desc='Análise institucional simulada. Nenhum dado será alterado em produção.';form=`<div class="field"><label>Município</label><input disabled value="${esc(r.city)}"></div><div class="field"><label>Responsável indicado</label><input disabled value="${esc(r.owner)}"></div><div class="field"><label>E-mail</label><input disabled value="${esc(r.email)}"></div><div class="field"><label>Situação</label>${statusLabel(r.status)}</div>`;}else if(kind==='newubs'){title='Nova solicitação de UBS';desc='Registre uma solicitação fictícia para experimentar a fila administrativa.';form=`<form id="modalForm"><div class="field"><label>Nome da UBS</label><input name="name" required minlength="3" placeholder="UBS Jardim das Flores"></div><div class="field"><label>Município</label><select name="city"><option>Belém · PA</option><option>Ananindeua · PA</option><option>Marituba · PA</option></select></div><div class="field"><label>Nome do responsável</label><input name="owner" required placeholder="Nome completo"></div><div class="field"><label>E-mail de contato</label><input name="email" type="email" required placeholder="responsavel@exemplo.test"></div></form>`}else if(kind==='invite'){title='Convidar profissional';desc='Simule a criação do convite. Nenhuma mensagem será enviada.';form=`<form id="modalForm"><div class="field"><label>Nome</label><input name="name" required minlength="3"></div><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>UBS</label><select name="unit"><option>UBS São José</option><option>UBS Central</option><option>UBS Vila Nova</option></select></div><div class="field"><label>Tipo de convite</label><select name="type"><option>Profissional de saúde</option><option>Responsável UBS</option></select></div></form>`}
let button=kind==='review'?(r.status==='Aprovada'?`<button class="btn" id="inviteResponsible">✉ Convidar responsável</button>`:`<button class="btn danger" id="rejectRequest">Rejeitar</button><button class="btn primary" id="approveRequest">✓ Aprovar UBS</button>`):`<button class="btn primary" type="submit" form="modalForm">${kind==='invite'?'Simular convite':'Criar solicitação'}</button>`;
document.getElementById('modalMount').innerHTML=`<div class="modal-overlay" id="modalOverlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p>${desc}</p>${form}<div class="modal-actions"><button class="btn" id="closeModal">Cancelar</button>${button}</div></div></div>`;document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal()});const f=document.getElementById('modalForm');if(f)f.addEventListener('submit',e=>{e.preventDefault();let d=new FormData(f);if(kind==='newubs'){requests.unshift({id:Date.now(),name:d.get('name'),city:d.get('city'),owner:d.get('owner'),email:d.get('email'),status:'Pendente',date:'Agora'});toast('Solicitação adicionada apenas à demonstração.')}else{invites.unshift({name:d.get('name'),email:d.get('email'),unit:d.get('unit'),type:d.get('type')==='Responsável UBS'?'Responsável UBS':'Profissional',status:'Pendente'});toast('Convite registrado na prévia; nenhum e-mail enviado.')}closeModal();render()});if(kind==='review'){const accept=document.getElementById('approveRequest'),reject=document.getElementById('rejectRequest'),resp=document.getElementById('inviteResponsible');if(accept)accept.addEventListener('click',()=>{r.status='Aprovada';closeModal();render();toast('UBS aprovada na demonstração. Agora é possível convidar o responsável.')});if(reject)reject.addEventListener('click',()=>{r.status='Rejeitada';closeModal();render();toast('Solicitação rejeitada na demonstração.')});if(resp)resp.addEventListener('click',()=>{closeModal();modal('invite');setTimeout(()=>{let fs=document.getElementById('modalForm');if(fs){fs.elements.name.value=r.owner;fs.elements.email.value=r.email;fs.elements.type.value='Responsável UBS';}},0)});}}
function download(){const csv=[['UBS','Municipio','Utilizacao demonstrativa (%)','Status'],['UBS São José','Belém',91,'Ativa'],['UBS Central','Belém',77,'Ativa'],['UBS Vila Nova','Ananindeua',59,'Ativa']].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='PAP-Saude-RELATORIO-DEMONSTRATIVO.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV demonstrativo exportado. Os dados não são reais.');}
const sidebar=document.getElementById('side');const SIDEBAR_COMPACT_KEY='pap_admin_sidebar_compact_demo';
try{if(localStorage.getItem(SIDEBAR_COMPACT_KEY)==='true')sidebar.classList.add('compact')}catch{}
function toggleSide(){sidebar.classList.toggle('compact');try{localStorage.setItem(SIDEBAR_COMPACT_KEY,String(sidebar.classList.contains('compact')))}catch{}}
document.getElementById('collapse').addEventListener('click',toggleSide);
document.getElementById('sidebarPin').addEventListener('click',toggleSide);
document.getElementById('sidebarQuickTicket').addEventListener('click',()=>openNewTicket(true));
document.getElementById('sidebarFilter').addEventListener('input',renderNav);
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||'')&&!document.getElementById('modalMount').children.length){e.preventDefault();if(window.innerWidth<=900){sidebar.classList.add('mobile-open');document.getElementById('overlay').classList.add('open')}document.getElementById('sidebarFilter').focus()}});
document.getElementById('sideWorkspace').addEventListener('click',()=>toast('Workspace PAP Saúde · demonstração. O acesso real depende do backend.'));
document.getElementById('sidebarProfile').addEventListener('click',()=>{document.getElementById('previewRole')?.focus();toast('Alterne o perfil de demonstração no topo para avaliar as visualizações.')});document.getElementById('mobileMenu').addEventListener('click',()=>{document.getElementById('side').classList.add('mobile-open');document.getElementById('overlay').classList.add('open')});document.getElementById('overlay').addEventListener('click',()=>{document.getElementById('side').classList.remove('mobile-open');document.getElementById('overlay').classList.remove('open')});document.getElementById('notify').addEventListener('click',()=>navigate('requests'));document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){state.query=e.target.value;navigate('requests');state.query=e.target.value;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();})();
</script>
</body></html>
